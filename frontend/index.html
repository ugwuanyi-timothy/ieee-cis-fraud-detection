<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection System</title>

    <style>
        
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 30px 16px;
    color: #1e293b;
}

.container {
    max-width: 650px;
    margin: 60px auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
}

h1 {
    text-align: center;
    color: #0f172a;
    font-size: 30px;
    margin-bottom: 15px;
}

p {
    color: #64748b;
    text-align: center;
    line-height: 1.7;
    margin-bottom: 25px;
}

input {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 25px 0;
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    background: #f8fafc;
}

button {
    width: 100%;
    padding: 16px;
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.2s;
}

button:hover {
    background: #1e40af;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

#result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    display: none;
    text-align: center;
    font-weight: bold;
}

.legitimate {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
}

.fraudulent {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}

.error {
    background: #fef3c7;
    color: #92400e;
}

pre {
    width: 100%;
    margin-top: 15px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #475569;
    white-space: normal;
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .container {
        margin: 25px auto;
        padding: 25px 18px;
    }

    h1 {
        font-size: 24px;
    }
}

    </style>
</head>

<body>

    <div class="container">

        <h1>Fraud Detection System</h1>

        <p>
            Upload a transaction JSON file to check
            whether it is potentially fraudulent.
        </p>

        <input type="file" id="transactionFile" accept=".json,application/json">

        <button id="predictButton" onclick="predictFraud()">
            Check Transaction
        </button>

        <div id="result"></div>

        <div id="details"></div>

    </div>

    <script>

        async function predictFraud() {

            const fileInput = document.getElementById("transactionFile");
            const resultDiv = document.getElementById("result");
            const detailsDiv = document.getElementById("details");
            const button = document.getElementById("predictButton");

            resultDiv.style.display = "none";
            detailsDiv.textContent = "";

            if (fileInput.files.length === 0) {
                resultDiv.className = "error";
                resultDiv.textContent = "Please select a JSON file.";
                resultDiv.style.display = "block";
                return;
            }

            try {

                const file = fileInput.files[0];

                const transaction = JSON.parse(await file.text());

                button.disabled = true;
                button.textContent = "Checking...";

                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(transaction)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Prediction failed.");
                }

                resultDiv.style.display = "block";

                if (data.prediction === 1) {
                    resultDiv.className = "fraudulent";
                    resultDiv.textContent = "Fraudulent Transaction";
                } else {
                    resultDiv.className = "legitimate";
                    resultDiv.textContent = "Legitimate Transaction";
                }

                const probability = Number(data.fraud_probability);

detailsDiv.innerHTML = `

    <!-- Transaction Analysis Box -->
    <div style="
        width:100%;
        max-width:300px;
        height:65px;
        margin:15px auto 10px;
        padding:8px;
        box-sizing:border-box;
        background:#1d4ed8;
        border-radius:9px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
    ">

        <h3 style="
            color:white;
            font-size:16px;
            margin:0;
        ">
            Transaction Analysis
        </h3>

        <p style="
            color:#dbeafe;
            font-size:11px;
            margin:0;
        ">
            Analysis of the submitted transaction
        </p>

    </div>


    <!-- Fraud Probability and Prediction Shared Box -->
    <div style="
        width:100%;
        max-width:420px;
        margin:0 auto 12px;
        padding:12px;
        box-sizing:border-box;
        background:white;
        border:1px solid #e2e8f0;
        border-radius:12px;
    ">

        <div style="
            display:flex;
            gap:10px;
            justify-content:center;
            align-items:stretch;
        ">

            <!-- Fraud Probability Box -->
            <div style="
                flex:1;
                min-width:0;
                padding:10px;
                height:90px;
                box-sizing:border-box;
                background:#dbeafe;
                border-radius:8px;
                text-align:center;
            ">

                <p style="
                    color:#1e40af;
                    font-size:13px;
                    margin:0;
                ">
                    Fraud Percentage
                </p>

                <h2 style="
                    color:#1d4ed8;
                    font-size:20px;
                    margin:8px 0;
                ">
                    ${(probability * 100).toFixed(2)}%
                </h2>

                <!-- Red Probability Bar -->
                <div style="
                    width:100%;
                    height:8px;
                    background:#bfdbfe;
                    border-radius:20px;
                    overflow:hidden;
                ">
                    <div style="
                        height:100%;
                        width:${Math.min(Math.max(probability * 100, 0), 100)}%;
                        background:#dc2626;
                        border-radius:20px;
                    "></div>
                </div>

            </div>


            <!-- Prediction Box -->
            <div style="
                flex:1;
                min-width:0;
                padding:10px;
                height:90px;
                box-sizing:border-box;
                background:#e0e7ff;
                border-radius:8px;
                text-align:center;
            ">

                <p style="
                    color:#3730a3;
                    font-size:13px;
                    margin:0;
                ">
                    Prediction
                </p>

                <h2 style="
                    color:#3730a3;
                    font-size:20px;
                    margin:12px 0 0;
                ">
                    ${data.prediction}
                </h2>

            </div>

        </div>
    </div>


    <!-- Separate Transaction Result Box -->
    <div style="
        width:100%;
        max-width:420px;
        height:90px;
        margin:0 auto;
        padding:15px;
        box-sizing:border-box;
        background:white;
        border:1px solid #e2e8f0;
        border-radius:12px;
        text-align:center;
    ">

        <p style="
            color:#334155;
            font-size:14px;
            font-weight:bold;
            margin:0 0 10px;
        ">
            Transaction Result
        </p>

        <div style="
            padding:12px;
            background:${data.prediction === 1 ? '#fee2e2' : '#dcfce7'};
            border-radius:8px;
        ">

            <h2 style="
                color:${data.prediction === 1 ? '#991b1b' : '#166534'};
                font-size:18px;
                margin:0;
            ">
                ${data.result.toUpperCase()}
            </h2>

        </div>

    </div>

`;

   } catch (error) {

                resultDiv.className = "error";
                resultDiv.textContent = error.message;
                resultDiv.style.display = "block";

            } finally {

                button.disabled = false;
                button.textContent = "Check Transaction";

            }
        }

    </script>

</body>
</html>
